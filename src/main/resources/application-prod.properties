# Production Configuration for AWS

# Server Configuration
server.port=${PORT:5000}
spring.application.name=F1RSTLOOK Digital

# MySQL Database Configuration (from RDS)
spring.datasource.url=${RDS_DB_URL:jdbc:mysql://localhost:3306/firstlook}
spring.datasource.username=${RDS_USERNAME:admin}
spring.datasource.password=${RDS_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 Console in production
spring.h2.console.enabled=false

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# WhatsApp Configuration
whatsapp.phone.number=919494385675
whatsapp.default.message=Hi! I'm interested in F1RSTLOOK Digital services.

# Logging
logging.level.com.firstlook=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
