# Server Configuration
server.port=${PORT:8080}
spring.application.name=F1RSTLOOK Digital

# Database Configuration (Auto-detect MySQL or H2)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:firstlook}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (only for development)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Mail Configuration (Configure with your SMTP settings)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# WhatsApp Configuration
whatsapp.phone.number=919494385675
whatsapp.default.message=Hi! I'm interested in F1RSTLOOK Digital services.

# Logging
logging.level.com.firstlook=DEBUG
logging.level.org.springframework.web=INFO
