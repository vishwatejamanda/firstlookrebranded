# Server Configuration
server.port=${PORT:8080}
spring.application.name=F1RSTLOOK Digital

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/firstlook
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Mail Configuration (Configure with your SMTP settings)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# WhatsApp Configuration
whatsapp.phone.number=919494385675
whatsapp.default.message=Hi! I'm interested in F1RSTLOOK Digital services.

# Logging
logging.level.com.firstlook=DEBUG
logging.level.org.springframework.web=INFO
